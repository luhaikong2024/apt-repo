# APT 分发仓配置（本仓库只做包管理与 Pages，不编包）
# 编包请到私有仓: https://github.com/luhaikong2024/apt-repo-toolchain

ORIGIN="linux-apt-repo"
LABEL="linux-apt-repo"
DESCRIPTION="Internal APT repository"

# 与构建仓矩阵保持一致
# Ubuntu: bionic=18.04 focal=20.04 jammy=22.04 noble=24.04
SUITES="bionic focal jammy noble"
COMPONENTS="main"
ARCHITECTURES="amd64 arm64"
DEFAULT_COMPONENT="main"

REPO_DIR="repo"
PUBLIC_DIR="public"

SIGNING_KEY_ID="02108634EA2F8451"
GPG_HOME="keys/gnupg"
GPG_PUBLIC_KEY="keys/repo-public.gpg"
ENABLE_SIGNING="yes"
