# APT 仓库全局配置（官方 dists/ + pool/ 布局）
# 修改后需重新执行 scripts/generate-repo.sh

# 仓库对外显示名（写入 Release）
ORIGIN="linux-apt-repo"
LABEL="linux-apt-repo"
DESCRIPTION="Internal APT repository"

# 支持的发行版代号（空格分隔）
# Ubuntu: bionic=18.04 focal=20.04 jammy=22.04 noble=24.04
SUITES="bionic focal jammy noble"

# 组件（官方常用 main）
COMPONENTS="main"

# 架构：apt 会按本机自动选 binary-<架构>/
# amd64 = 常见 x86_64；arm64 = ARM 64 位
ARCHITECTURES="amd64 arm64"

# 默认组件（导入 deb 时使用）
DEFAULT_COMPONENT="main"

# 软件包名（与 packaging/<name>、source 产物对应）
# 可在构建时用 PACKAGE_NAME=xxx 覆盖
PACKAGE_NAME="myapp"

# 包版本（可在构建时用 PACKAGE_VERSION=x.y.z 覆盖）
PACKAGE_VERSION="1.0.0"

# 仓库根目录（相对项目根）
REPO_DIR="repo"

# GitLab Pages / 静态发布目录（最终对外的内容）
PUBLIC_DIR="public"

# GPG 签名
# SIGNING_KEY_ID 为空时尝试使用 keys/private 中的默认密钥
SIGNING_KEY_ID="02108634EA2F8451"
GPG_HOME="keys/gnupg"
GPG_PUBLIC_KEY="keys/repo-public.gpg"

# 是否生成 InRelease / Release.gpg（需要已初始化 GPG）
ENABLE_SIGNING="yes"

# Docker 构建镜像前缀（本地 tag）
DOCKER_IMAGE_PREFIX="linux-apt-repo-builder"

# 工具链安装前缀（构建容器内 / 本地构建时）
TOOLCHAIN_PREFIX="/opt/custom-toolchain"
