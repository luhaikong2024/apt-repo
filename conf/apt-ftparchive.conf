# apt-ftparchive 目录扫描配置
# Path 相对于 REPO_DIR（repo/）

Dir {
  ArchiveDir ".";
  CacheDir "./.cache";
};

Default {
  Packages::Compress ". gzip xz";
  Sources::Compress ". gzip xz";
  Contents::Compress ". gzip xz";
};

TreeDefault {
  Directory "pool/";
  SrcDirectory "pool/";
  Packages "$(DIST)/$(SECTION)/binary-$(ARCH)/Packages";
  Contents "$(DIST)/Contents-$(ARCH)";
};

# 以下 BinDirectory 由 scripts/generate-repo.sh 按 suite/component/arch 动态生成补充文件
# conf/apt-ftparchive-bins.conf
