# 仅分发：导入 incoming → 生成官方仓库 → GitHub Pages
name: apt-repo-pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnupg gzip xz-utils dpkg-dev apt-utils ca-certificates

      - name: Import or init GPG key
        env:
          APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p keys/gnupg
          chmod 700 keys/gnupg
          export GNUPGHOME="$GITHUB_WORKSPACE/keys/gnupg"
          if [ -n "${APT_REPO_GPG_PRIVATE_KEY:-}" ]; then
            echo "$APT_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
            KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
            sed -i "s/^SIGNING_KEY_ID=.*/SIGNING_KEY_ID=\"${KEY_ID}\"/" conf/repo.conf
            gpg --export --armor "$KEY_ID" > keys/repo-public.gpg
          else
            ./scripts/init-gpg.sh
          fi

      - name: Import incoming and publish
        run: |
          export GNUPGHOME="$GITHUB_WORKSPACE/keys/gnupg"
          ./scripts/import-incoming.sh
          ./scripts/generate-repo.sh
          ./scripts/publish.sh
          ls -la public/repo-key.gpg public/repo-key.asc
          test -s public/repo-key.gpg
          find public/dists -type d | sort
          grep -E '^(Package|Version|Filename):' public/dists/jammy/main/binary-amd64/Packages || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
